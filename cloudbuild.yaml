steps:
  # 1. Install frontend dependencies
  - name: 'gcr.io/cloud-builders/npm'
    id: 'npm-install'
    args: ['install']

  # 2. Build the Next.js static site
  - name: 'gcr.io/cloud-builders/npm'
    id: 'build-next-app'
    args: ['run', 'build']
    waitFor: ['npm-install']

  # 3. Deploy to Firebase Hosting
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-to-firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm install -g firebase-tools && firebase deploy --only hosting --project $PROJECT_ID --token $$FIREBASE_TOKEN'
    waitFor: ['build-next-app']
    secretEnv: ['FIREBASE_TOKEN']

# To use this, you need to:
# 1. Create a secret in Secret Manager named 'firebase-token' with your Firebase CI token.
#    (Generate a token with `firebase login:ci`)
# 2. Grant the Cloud Build service account the 'Secret Manager Secret Accessor' role.
# 3. Set up a Cloud Build trigger and connect it to your source repository.

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/firebase-token/versions/latest
    env: 'FIREBASE_TOKEN'
